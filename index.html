<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Opening Amsterdam Point Map</title>
  <style>html,body{height:100%;margin:0;background:#07131f;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:24px}.box{max-width:460px;background:#10283a;border:1px solid #315a74;border-radius:16px;padding:20px}a{color:#7dcbff}</style>
</head>
<body>
  <div class="box"><h1>Opening compatible map…</h1><p>Loading the Leaflet point-only build. No rectangles, dashed connectors, frontage strips or WebGL engine.</p><p><a id="direct" href="leaflet-point.html?release=leaflet-points-v1">Open directly</a></p></div>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
        if('caches' in window){const names=await caches.keys();await Promise.all(names.map(n=>caches.delete(n)));}
      }catch(error){console.warn(error);}
      location.replace('leaflet-point.html?release=leaflet-points-v1');
    })();
  </script>
</body>
</html>

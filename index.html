<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081321">
<title>Loading Amsterdam Interactive Map V2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#081321;color:#f5f8fb}body{display:grid;place-items:center;padding:24px}.loader{width:min(460px,100%);background:#10253b;border:1px solid #31516c;border-radius:16px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.35)}h1{font-size:19px;margin:0 0 7px}.sub{color:#b6c5d2;font-size:12px;line-height:1.45}.track{height:9px;background:#07111c;border-radius:999px;overflow:hidden;margin:18px 0 9px}.bar{height:100%;width:8%;background:linear-gradient(90deg,#087df0,#18c5d9);border-radius:inherit;transition:width .18s ease}.row{display:flex;justify-content:space-between;gap:10px;color:#aebdca;font-size:11px}.error{display:none;margin-top:15px;padding:10px;border-left:4px solid #e21c32;background:#35141c;border-radius:7px;font-size:12px;line-height:1.4}button{display:none;width:100%;margin-top:12px;padding:10px;border:0;border-radius:9px;background:#087df0;color:#fff;font:inherit;font-weight:850}</style>
</head>
<body>
<main class="loader">
  <h1>Amsterdam Interactive Map</h1>
  <div class="sub">Preparing the high-contrast vector map, live tracking, landmarks and navigation controls.</div>
  <div class="track"><div id="bar" class="bar"></div></div>
  <div class="row"><span id="stage">Checking local cache…</span><strong id="percent">8%</strong></div>
  <div id="error" class="error"></div>
  <button id="retry" type="button">Retry loading</button>
</main>
<script>
(() => {
  'use strict';
  const VERSION='amsterdam-vector-v2-20260726';
  const CACHE_KEY=`${VERSION}:html`;
  const PARTS=Array.from({length:7},(_,index)=>`site-chunks/part-${String(index).padStart(3,'0')}.txt`);
  const bar=document.getElementById('bar');
  const stage=document.getElementById('stage');
  const percent=document.getElementById('percent');
  const errorBox=document.getElementById('error');
  const retry=document.getElementById('retry');

  function progress(value,message){
    const bounded=Math.max(8,Math.min(100,value));
    bar.style.width=`${bounded}%`;
    percent.textContent=`${Math.round(bounded)}%`;
    stage.textContent=message;
  }
  function valid(html){
    return typeof html==='string'&&html.includes('VECTOR V2')&&html.includes('maplibregl.Map')&&html.includes('navigator.geolocation.watchPosition');
  }
  function bytesFromBase64(value){
    const clean=value.replace(/\s+/g,'');
    const output=new Uint8Array(Math.floor(clean.length*3/4));
    let offset=0;
    for(let start=0;start<clean.length;start+=32768){
      const block=atob(clean.slice(start,start+32768));
      for(let index=0;index<block.length;index++)output[offset++]=block.charCodeAt(index);
    }
    return output.subarray(0,offset);
  }
  async function decompress(bytes){
    if('DecompressionStream' in window){
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }
    progress(78,'Loading compatibility decompressor…');
    await new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src='https://unpkg.com/pako@2.1.0/dist/pako.min.js';
      script.onload=resolve;script.onerror=()=>reject(new Error('Compatibility decompressor failed to load.'));
      document.head.appendChild(script);
    });
    return window.pako.ungzip(bytes,{to:'string'});
  }
  function launch(html){
    progress(100,'Launching map…');
    try{localStorage.setItem(CACHE_KEY,html)}catch{}
    setTimeout(()=>{
      document.open();
      document.write(html);
      document.close();
    },60);
  }
  async function load(){
    errorBox.style.display='none';retry.style.display='none';
    try{
      const cached=localStorage.getItem(CACHE_KEY);
      if(valid(cached)){
        progress(95,'Opening cached application…');
        launch(cached);
        return;
      }
    }catch{}

    progress(18,'Downloading optimised application…');
    const results=await Promise.all(PARTS.map(async(path,index)=>{
      const response=await fetch(path,{cache:'force-cache'});
      if(!response.ok)throw new Error(`Application part ${index+1} returned HTTP ${response.status}.`);
      progress(18+((index+1)/PARTS.length)*42,`Downloaded part ${index+1} of ${PARTS.length}…`);
      return response.text();
    }));
    progress(66,'Reconstructing application…');
    const bytes=bytesFromBase64(results.join(''));
    progress(74,'Decompressing vector interface…');
    const html=await decompress(bytes);
    if(!valid(html))throw new Error('The reconstructed application failed its integrity check.');
    progress(92,'Application verified…');
    launch(html);
  }
  function fail(error){
    console.error(error);
    stage.textContent='Loading stopped';
    errorBox.textContent=`${error.message} Check the internet connection and retry.`;
    errorBox.style.display='block';
    retry.style.display='block';
  }
  retry.addEventListener('click',()=>load().catch(fail));
  load().catch(fail);
})();
</script>
</body>
</html>

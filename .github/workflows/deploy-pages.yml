name: Deploy Amsterdam interactive map

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "DEPLOYMENT_SUCCESS.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 --decode site.html.gz.b64 | gzip --decompress > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q "Amsterdam live visitor" _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout repository for deployment receipt
        uses: actions/checkout@v6

      - name: Record successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Deployment successful"
            echo
            echo "GitHub Pages URL: ${PAGE_URL}"
            echo
            echo "Deployment completed: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Commit: ${GITHUB_SHA}"
          } > DEPLOYMENT_SUCCESS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_SUCCESS.md
          git commit -m "Record successful Pages deployment [skip ci]" || exit 0
          git push

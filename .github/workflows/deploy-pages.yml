name: Deploy Amsterdam interactive map

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "DEPLOYMENT_STATUS.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_build: ${{ steps.site_build.outcome }}
      pages_config: ${{ steps.pages_config.outcome }}
      artifact_upload: ${{ steps.artifact_upload.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Decode and validate static site
        id: site_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 --decode site.html.gz.b64 | gzip --decompress > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q "Amsterdam live visitor" _site/index.html

      - name: Configure GitHub Pages
        id: pages_config
        continue-on-error: true
        if: steps.site_build.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: artifact_upload
        continue-on-error: true
        if: steps.site_build.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Fail build when a required stage failed
        if: steps.site_build.outcome != 'success' || steps.pages_config.outcome != 'success' || steps.artifact_upload.outcome != 'success'
        shell: bash
        run: |
          echo "Site build: ${{ steps.site_build.outcome }}"
          echo "Pages configuration: ${{ steps.pages_config.outcome }}"
          echo "Artifact upload: ${{ steps.artifact_upload.outcome }}"
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  status:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Record deployment status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SITE_BUILD: ${{ needs.build.outputs.site_build }}
          PAGES_CONFIG: ${{ needs.build.outputs.pages_config }}
          ARTIFACT_UPLOAD: ${{ needs.build.outputs.artifact_upload }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# GitHub Pages deployment status"
            echo
            echo "Build job: ${BUILD_RESULT}"
            echo
            echo "Site decode/validation: ${SITE_BUILD:-unknown}"
            echo
            echo "Pages configuration: ${PAGES_CONFIG:-unknown}"
            echo
            echo "Artifact upload: ${ARTIFACT_UPLOAD:-unknown}"
            echo
            echo "Deploy job: ${DEPLOY_RESULT}"
            echo
            echo "Pages URL: ${PAGE_URL:-not available}"
            echo
            echo "Checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Commit: ${GITHUB_SHA}"
          } > DEPLOYMENT_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          git commit -m "Record Pages deployment status [skip ci]" || exit 0
          git push

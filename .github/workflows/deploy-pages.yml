name: Deploy Amsterdam interactive map

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "DEPLOYMENT_STATUS.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 --decode site.html.gz.b64 | gzip --decompress > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q "Amsterdam live visitor" _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  status:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Record deployment status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# GitHub Pages deployment status"
            echo
            echo "Build result: ${BUILD_RESULT}"
            echo
            echo "Deploy result: ${DEPLOY_RESULT}"
            echo
            echo "Pages URL: ${PAGE_URL:-not available}"
            echo
            echo "Checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Commit: ${GITHUB_SHA}"
          } > DEPLOYMENT_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          git commit -m "Record Pages deployment status [skip ci]" || exit 0
          git push

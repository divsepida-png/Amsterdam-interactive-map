name: Materialize and verify Amsterdam vector map

on:
  push:
    branches: ["main"]
    paths:
      - "site-chunks/**"
      - ".github/workflows/materialize-and-verify.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amsterdam-vector-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reassemble and validate application
        id: assemble
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find site-chunks -maxdepth 1 -name 'part-*.txt' | wc -l)
          echo "Source chunk count: ${COUNT}"
          test "$COUNT" -eq 7
          cat site-chunks/part-*.txt > site.html.gz.b64
          base64 --decode site.html.gz.b64 | gzip --decompress > index.html
          test -s index.html
          grep -q "Amsterdam live visitor" index.html
          grep -q "VECTOR V2" index.html
          grep -q "maplibregl.Map" index.html
          grep -q "navigator.geolocation.watchPosition" index.html
          grep -q "Drop waypoint" index.html
          grep -q "Travelled path" index.html

      - name: Check public map dependencies
        id: dependencies
        continue-on-error: true
        if: steps.assemble.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js -o /tmp/maplibre.js
          test -s /tmp/maplibre.js
          curl --fail --location --silent --show-error \
            https://tiles.openfreemap.org/styles/liberty -o /tmp/openfreemap-style.json
          test -s /tmp/openfreemap-style.json
          grep -q '"version"' /tmp/openfreemap-style.json

      - name: Commit rendered application
        id: commit_site
        continue-on-error: true
        if: steps.assemble.outcome == 'success' && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.html.gz.b64
          git commit -m "Publish high-performance vector map [skip ci]" || true
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify immutable HTTPS application
        id: verify
        continue-on-error: true
        if: steps.commit_site.outcome == 'success'
        env:
          SITE_SHA: ${{ steps.commit_site.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githack.com/${GITHUB_REPOSITORY}/${SITE_SHA}/index.html"
          SUCCESS=false
          for ATTEMPT in $(seq 1 24); do
            HTTP_CODE=$(curl --location --silent --show-error --output live.html --write-out '%{http_code}' "$URL" || true)
            if [ "$HTTP_CODE" = "200" ] \
              && grep -q "Amsterdam live visitor" live.html \
              && grep -q "VECTOR V2" live.html \
              && grep -q "maplibregl.Map" live.html \
              && grep -q "navigator.geolocation.watchPosition" live.html; then
              SUCCESS=true
              break
            fi
            sleep 5
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "HTTPS verification failed for $URL"
            exit 1
          fi
          HEADERS=$(curl --location --silent --show-error --head "$URL")
          if printf '%s' "$HEADERS" | grep -Eiq '^permissions-policy:.*geolocation=\(\)'; then
            echo "Hosting service explicitly blocks geolocation"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Record deployment result
        if: always()
        env:
          ASSEMBLE: ${{ steps.assemble.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          COMMIT_SITE: ${{ steps.commit_site.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          LIVE_URL: ${{ steps.verify.outputs.url }}
          SITE_SHA: ${{ steps.commit_site.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Amsterdam Interactive Map — vector deployment status"
            echo
            echo "Assembly: ${ASSEMBLE:-not-run}"
            echo
            echo "Public dependencies: ${DEPENDENCIES:-not-run}"
            echo
            echo "Rendered-site commit: ${COMMIT_SITE:-not-run}"
            echo
            echo "HTTPS verification: ${VERIFY:-not-run}"
            echo
            echo "Edition: high-contrast MapLibre vector V2"
            echo
            echo "HTTPS URL: ${LIVE_URL:-not available}"
            echo
            echo "Site commit: ${SITE_SHA:-not available}"
            echo
            echo "Checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > HOSTING_STATUS.md
          git pull --rebase || true
          git add HOSTING_STATUS.md
          git commit -m "Record vector-map deployment result [skip ci]" || true
          git push

      - name: Fail when deployment was not verified
        if: always() && steps.verify.outcome != 'success'
        shell: bash
        run: exit 1

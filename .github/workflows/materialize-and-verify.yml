name: Publish and verify Amsterdam vector map

on:
  push:
    branches: ["main"]
    paths:
      - "site-chunks/**"
      - ".github/workflows/materialize-and-verify.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amsterdam-vector-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reassemble direct application
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find site-chunks -maxdepth 1 -name 'part-*.txt' | wc -l)
          test "$COUNT" -eq 7
          cat site-chunks/part-*.txt > site.html.gz.b64
          base64 --decode site.html.gz.b64 | gzip --decompress > index.html
          test -s index.html
          grep -q "Amsterdam live visitor" index.html
          grep -q "VECTOR V2" index.html
          grep -q "maplibregl.Map" index.html
          grep -q "navigator.geolocation.watchPosition" index.html
          grep -q "Drop waypoint" index.html
          grep -q "Travelled path" index.html
          test "$(wc -c < index.html)" -gt 50000

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline application script found')
          Path('/tmp/app.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Check public map dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --fail --location --silent --show-error \
            https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js -o /tmp/maplibre.js
          test -s /tmp/maplibre.js
          curl --retry 3 --fail --location --silent --show-error \
            https://tiles.openfreemap.org/styles/liberty -o /tmp/openfreemap-style.json
          test -s /tmp/openfreemap-style.json
          grep -q '"version"' /tmp/openfreemap-style.json

      - name: Commit direct application
        id: commit_site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.html.gz.b64
          git commit -m "Publish direct Amsterdam vector application [skip ci]" || true
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or confirm GitHub Pages site
        id: enable_pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --location --silent --show-error \
            --output /tmp/pages-response.json --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"build_type":"workflow"}')
          echo "http_code=${HTTP_CODE}" >> "$GITHUB_OUTPUT"
          cat /tmp/pages-response.json || true
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "409" ]; then
            exit 1
          fi

      - name: Configure Pages
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        id: pages_upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: pages_deploy
        continue-on-error: true
        if: steps.pages_config.outcome == 'success' && steps.pages_upload.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Verify working HTTPS endpoints
        id: verify
        continue-on-error: true
        env:
          SITE_SHA: ${{ steps.commit_site.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/Amsterdam-interactive-map/"
          FALLBACK_URL="https://raw.githack.com/${GITHUB_REPOSITORY}/${SITE_SHA}/index.html"
          WORKING_URL=""
          for URL in "$PAGE_URL" "$FALLBACK_URL"; do
            for ATTEMPT in $(seq 1 24); do
              HTTP_CODE=$(curl --location --silent --show-error --output /tmp/live.html --write-out '%{http_code}' "$URL" || true)
              if [ "$HTTP_CODE" = "200" ] \
                && grep -q "Amsterdam live visitor" /tmp/live.html \
                && grep -q "VECTOR V2" /tmp/live.html \
                && grep -q "maplibregl.Map" /tmp/live.html; then
                WORKING_URL="$URL"
                break 2
              fi
              sleep 5
            done
          done
          if [ -z "$WORKING_URL" ]; then
            exit 1
          fi
          echo "url=$WORKING_URL" >> "$GITHUB_OUTPUT"

      - name: Record publication status
        if: always()
        env:
          DIRECT_SHA: ${{ steps.commit_site.outputs.sha }}
          ENABLE_PAGES: ${{ steps.enable_pages.outcome }}
          ENABLE_HTTP: ${{ steps.enable_pages.outputs.http_code }}
          CONFIGURE: ${{ steps.pages_config.outcome }}
          UPLOAD: ${{ steps.pages_upload.outcome }}
          DEPLOY: ${{ steps.pages_deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          LIVE_URL: ${{ steps.verify.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Amsterdam Interactive Map — publication status"
            echo
            echo "Direct application commit: ${DIRECT_SHA:-not available}"
            echo
            echo "Pages activation: ${ENABLE_PAGES:-not-run} (HTTP ${ENABLE_HTTP:-n/a})"
            echo
            echo "Pages configuration: ${CONFIGURE:-not-run}"
            echo
            echo "Artifact upload: ${UPLOAD:-not-run}"
            echo
            echo "Pages deployment: ${DEPLOY:-not-run}"
            echo
            echo "Live verification: ${VERIFY:-not-run}"
            echo
            echo "Verified HTTPS URL: ${LIVE_URL:-not available}"
            echo
            echo "Delivery mode: direct single-page application; no reconstruction loader"
            echo
            echo "Checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > HOSTING_STATUS.md
          git pull --rebase || true
          git add HOSTING_STATUS.md
          git commit -m "Record direct-map publication status [skip ci]" || true
          git push

      - name: Fail when no live endpoint verified
        if: always() && steps.verify.outcome != 'success'
        shell: bash
        run: exit 1
